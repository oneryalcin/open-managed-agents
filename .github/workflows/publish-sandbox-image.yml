name: Publish sandbox image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable sandbox image tag (for example 0.1.0)
        required: true
        default: 0.1.0
  push:
    tags:
      - sandbox-v*

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/oneryalcin/open-managed-agents-sandbox
  MAX_COMPRESSED_BYTES: "26214400"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Select immutable tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#sandbox-v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="0.1.0-dev.${GITHUB_SHA:0:12}"
          fi
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing release tag
        run: |
          set -euo pipefail
          ref="${IMAGE_NAME}:${{ steps.tag.outputs.value }}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "::error::Sandbox image tag already exists: $ref"
            exit 1
          fi

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/sandbox
          file: images/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Enforce compressed-size budget
        run: node scripts/check-oci-image-size.mjs "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" "$MAX_COMPRESSED_BYTES"

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Attest image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Note private-repository attestation limitation
        if: ${{ github.event.repository.private }}
        run: echo "GitHub artifact attestations are unavailable for user-owned private repositories; BuildKit provenance and SBOM remain attached to the image." >> "$GITHUB_STEP_SUMMARY"

      - name: Record immutable reference
        run: |
          {
            echo "### OMA sandbox image"
            echo
            echo '```text'
            echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
